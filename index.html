<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尾牙許願池</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Microsoft JhengHei',sans-serif;background:linear-gradient(#0a1835,#23467c 60%,#372619);color:#fff}header{text-align:center;padding:30px 15px}h1{font-size:clamp(32px,6vw,58px);color:#ffdf8d;margin:5px}.layout{max-width:1080px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:25px;padding:15px;align-items:center}.fountain{width:100%;text-align:center}.fountain svg{width:100%;max-height:430px}.jet{stroke:#c0f0ff;stroke-width:5;fill:none;stroke-dasharray:12 10;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-44}}form,.admin{background:#ffffff17;border:1px solid #eac98180;border-radius:18px;padding:24px}label{display:block;margin:14px 0 6px}input,textarea{width:100%;font:inherit;background:#0d2045;border:1px solid #ffffff66;color:#fff;padding:12px;border-radius:10px;min-height:45px}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{cursor:pointer;font:inherit;border-radius:10px;padding:12px}button.primary{width:100%;margin-top:18px;background:linear-gradient(#fff0ba,#eab441);color:#5a3700;font-weight:800;border:0;min-height:50px}.board-area{padding:45px 15px;background:#382719}.board-head{max-width:1080px;margin:auto;display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}.board{max-width:1080px;margin:15px auto;background:#c69b65;border:12px solid #714827;min-height:260px;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:18px;align-content:start;border-radius:12px}.note{background:var(--c);color:#3b2a18;padding:28px 15px 15px;min-height:145px;overflow-wrap:anywhere;box-shadow:3px 6px 12px #0003;position:relative}.note:before{content:'📍';position:absolute;top:3px;left:46%}.note strong{font-size:19px}.note small{display:block;margin-top:15px}.admin{max-width:1080px;margin:25px auto}.hidden{display:none}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{padding:15px;background:#ffffff22;border-radius:10px}.kpi b{display:block;font-size:30px;color:#ffe4a2}.track{height:14px;background:#ffffff33;border-radius:12px;overflow:hidden;margin:5px 0 14px}.fill{height:100%;background:#f3bd55}.coin,.orb{position:fixed;z-index:20;pointer-events:none}.coin{width:36px;height:36px;border-radius:50%;background:#f4ca65;border:3px solid #a8791b;color:#744d12;display:grid;place-items:center}.orb{background:#fff0bb;color:#69420a;padding:18px;border-radius:14px;box-shadow:0 0 35px 15px #ffe9a099;font-size:20px;font-weight:800;max-width:260px;overflow-wrap:anywhere}.muted{font-size:13px;color:#d9e2ef}footer{text-align:center;padding:20px;font-size:12px;color:#d1c6b4}@media(max-width:720px){.layout{display:flex;flex-direction:column;padding:10px}.fountain svg{height:230px}form{width:100%;padding:18px}.board{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;border-width:8px}.note{padding:26px 10px 12px}.note strong{font-size:16px}.kpis{grid-template-columns:1fr 1fr}}@media(max-width:350px){.row,.board{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><header><div style="letter-spacing:.2em;color:#ffe5a7;font-size:12px">YEAR-END PARTY · WISHING FOUNTAIN</div><h1>✨ 尾牙許願池 ✨</h1><p>投下一枚硬幣，許下你的尾牙大獎願望</p><p>🪙 已有 <b id="count">0</b> 個願望</p></header><main class="layout"><div class="fountain"><svg viewBox="0 0 550 420" id="fountain" aria-label="噴水池"><defs><linearGradient id="w" x2="0" y2="1"><stop stop-color="#9deaff"/><stop offset="1" stop-color="#1367ac"/></linearGradient><linearGradient id="s" x2="0" y2="1"><stop stop-color="#f0e9d8"/><stop offset="1" stop-color="#968b77"/></linearGradient></defs><ellipse cx="275" cy="380" rx="265" ry="35" fill="#0005"/><path d="M20 335 Q20 290 275 290 Q530 290 530 335 L530 370 Q530 410 275 410 Q20 410 20 370Z" fill="url(#s)"/><ellipse cx="275" cy="333" rx="255" ry="46" fill="#e8dfcc"/><ellipse id="pool" cx="275" cy="335" rx="233" ry="34" fill="url(#w)"/><path d="M260 340 L265 225 H285 L290 340Z" fill="url(#s)"/><path d="M168 225 Q275 290 382 225Z" fill="url(#s)"/><ellipse cx="275" cy="225" rx="107" ry="17" fill="#eee5d2"/><ellipse cx="275" cy="226" rx="95" ry="12" fill="url(#w)"/><path d="M268 220 L270 151 H280 L282 220Z" fill="url(#s)"/><path d="M228 150 Q275 185 322 150Z" fill="url(#s)"/><ellipse cx="275" cy="150" rx="47" ry="10" fill="#e7e2d2"/><path class="jet" d="M275 147 L275 55 M275 55 Q245 50 230 148 M275 55 Q305 50 320 148 M230 153 Q205 170 205 225 M320 153 Q345 170 345 225 M170 226 Q130 255 120 336 M380 226 Q420 255 430 336"/></svg></div><form id="form"><h2>🪙 許下你的願望</h2><p class="muted">匿名顯示：佈告欄與統計只會顯示部門，不顯示姓名。</p><div class="row"><div><label for="dept">部門 *</label><input id="dept" maxlength="20" required placeholder="行銷部"></div><div><label for="name">姓名（選填）</label><input id="name" maxlength="20" placeholder="不會儲存"></div></div><label for="prize">想要的尾牙獎品 *</label><input id="prize" maxlength="40" required placeholder="日本來回機票"><label for="reason">許願理由（選填）</label><textarea id="reason" maxlength="100" placeholder="為什麼想要這個獎品？"></textarea><p class="muted" id="length">0 / 100</p><button id="submit" class="primary">🪙 投下硬幣許願</button><p id="status" aria-live="polite" class="muted"></p></form></main><section class="board-area" id="wishes"><div class="board-head"><div><h2>📌 尾牙許願佈告欄</h2><p>看看大家都想抽到什麼！</p></div><div><input id="search" placeholder="搜尋願望" aria-label="搜尋願望" style="width:160px"><button id="adminBtn" type="button">📊 統計示範</button></div></div><div class="board" id="board"></div><section id="admin" class="admin hidden"><h2>📊 匿名願望統計（示範）</h2><p class="muted">此頁尚無管理者登入保護，部署前須接入權限驗證。資料只限本瀏覽器。</p><div class="kpis"><div class="kpi">願望總數<b id="total">0</b></div><div class="kpi">參與部門<b id="depts">0</b></div><div class="kpi">不同獎品<b id="unique">0</b></div></div><h3>部門許願數</h3><div id="deptBars"></div><h3>熱門獎品 TOP 10</h3><div id="prizeBars"></div><button id="export" type="button">⬇ 匯出匿名 CSV</button></section></section><footer>此為 GitHub Pages 靜態展示版，願望不會跨裝置同步。正式活動需另接共用資料庫。</footer><script>
const $=s=>document.querySelector(s),KEY='weiya-github-demo';let wishes=[];try{wishes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function render(){const q=$('#search').value.toLowerCase();$('#count').textContent=wishes.length;const items=[...wishes].reverse().filter(w=>(w.prize+' '+w.reason+' '+w.dept).toLowerCase().includes(q));$('#board').innerHTML=items.length?items.map((w,i)=>`<article class="note" style="--c:${['#fff4a3','#d4f4d7','#ffd8e1','#d7e9ff','#f7e1bd'][i%5]}"><strong>🎁 ${esc(w.prize)}</strong><p>${esc(w.reason)}</p><small>匿名 · ${esc(w.dept)}<br>${new Date(w.ts).toLocaleDateString('zh-TW')}</small></article>`).join(''):'<p style="color:#3b2a18">還沒有願望，快來許第一個！</p>';let d={},p={};wishes.forEach(w=>{d[w.dept]=(d[w.dept]||0)+1;p[w.prize]=(p[w.prize]||0)+1});$('#total').textContent=wishes.length;$('#depts').textContent=Object.keys(d).length;$('#unique').textContent=Object.keys(p).length;function bars(data,sel,limit){const arr=Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,limit),max=Math.max(1,...arr.map(x=>x[1]));$(sel).innerHTML=arr.map(([k,v])=>`<div>${esc(k)} · ${v}</div><div class="track"><div class="fill" style="width:${100*v/max}%"></div></div>`).join('')||'尚無資料'}bars(d,'#deptBars',100);bars(p,'#prizeBars',10)}$('#search').oninput=render;$('#reason').oninput=()=>$('#length').textContent=$('#reason').value.length+' / 100';$('#adminBtn').onclick=()=>{$('#admin').classList.toggle('hidden');if(!$('#admin').classList.contains('hidden'))$('#admin').scrollIntoView({behavior:'smooth'})};$('#export').onclick=()=>{let rows=[['部門','獎品','理由','時間'],...wishes.map(w=>[w.dept,w.prize,w.reason,new Date(w.ts).toLocaleString('zh-TW')])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='尾牙匿名願望.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#form').onsubmit=async e=>{e.preventDefault();let dept=$('#dept').value.trim(),prize=$('#prize').value.trim();if(!dept||!prize)return;wishes.push({dept,prize,reason:$('#reason').value.trim(),ts:Date.now()});try{localStorage.setItem(KEY,JSON.stringify(wishes))}catch{}render();$('#form').reset();$('#length').textContent='0 / 100';$('#status').textContent='願望已立即出現在佈告欄！';let btn=$('#submit');btn.disabled=true;let from=btn.getBoundingClientRect(),pool=$('#pool').getBoundingClientRect(),x=from.left+from.width/2,y=from.top+from.height/2,px=pool.left+pool.width*.5,py=pool.top+pool.height*.5;try{let coin=document.createElement('div');coin.className='coin';coin.textContent='福';document.body.appendChild(coin);await coin.animate([{transform:`translate(${x}px,${y}px)`},{transform:`translate(${(x+px)/2}px,${Math.min(y,py)-90}px) rotateY(540deg)`,offset:.5},{transform:`translate(${px}px,${py}px) scale(.3) rotateY(1080deg)`,opacity:0}],{duration:900,fill:'forwards'}).finished;coin.remove();let orb=document.createElement('div');orb.className='orb';orb.textContent='✨ '+prize;document.body.appendChild(orb);await orb.animate([{transform:`translate(${px-90}px,${py}px) scale(.4)`,opacity:0},{transform:`translate(${px-90}px,${py-90}px)`,opacity:1,offset:.4},{transform:`translate(${px-90}px,${py-150}px)`,opacity:0}],{duration:1800,fill:'forwards'}).finished;orb.remove()}catch{}btn.disabled=false;$('#wishes').scrollIntoView({behavior:'smooth'})};render();
</script></body></html>
